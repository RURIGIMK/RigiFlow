allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

// Fix for "Namespace not specified" in AGP 8.0+
// Using plugins.configureEach to avoid "already evaluated" errors
subprojects {
    project.plugins.configureEach { plugin ->
        if (plugin.class.name.contains("com.android.build.gradle.AppPlugin") ||
            plugin.class.name.contains("com.android.build.gradle.LibraryPlugin")) {
            project.android {
                if (namespace == null) {
                    if (project.name == 'telephony') {
                        namespace = 'com.shounakmulay.telephony'
                    } else {
                        namespace = "com.rigiflow.${project.name.replaceAll(/[^a-zA-Z0-9]/, '.')}"
                    }
                }
            }
        }
    }
}
